<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160" fill="none">
  <!-- Option B, "Night play": a crescent moon whose cut-out is a play button. Replay, after hours. -->
  <rect width="480" height="160" fill="#070A14"/>
  <defs>
    <radialGradient id="b-g" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(58 60) rotate(45) scale(80)">
      <stop stop-color="#8FA6FF"/>
      <stop offset="0.6" stop-color="#5B7CFA"/>
      <stop offset="1" stop-color="#3B2A8C"/>
    </radialGradient>
    <mask id="b-m">
      <rect width="480" height="160" fill="#fff"/>
      <path d="M78 64l26 16-26 16z" fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
    </mask>
  </defs>
  <circle cx="72" cy="80" r="40" fill="url(#b-g)" mask="url(#b-m)"/>
  <circle cx="72" cy="80" r="52" stroke="#5B7CFA" stroke-opacity="0.18" stroke-width="2"/>
  <text x="136" y="92" font-family="'Instrument Serif', Georgia, serif" font-size="40" font-style="italic" fill="#E6EAF5">Moody Blues</text>
</svg>
